name: EventFlow CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}/eventflow

jobs:

  build:
    name: Maven Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build all services
        run: |
          mvn package -f eventflow/order-service/pom.xml -DskipTests -B
          mvn package -f eventflow/inventory-service/pom.xml -DskipTests -B
          mvn package -f eventflow/payment-service/pom.xml -DskipTests -B
          mvn package -f eventflow/notification-service/pom.xml -DskipTests -B

  docker:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Maven artifacts
        run: |
          mvn package -f eventflow/order-service/pom.xml -DskipTests -B
          mvn package -f eventflow/inventory-service/pom.xml -DskipTests -B
          mvn package -f eventflow/payment-service/pom.xml -DskipTests -B
          mvn package -f eventflow/notification-service/pom.xml -DskipTests -B

      - name: Build and Push order-service
        uses: docker/build-push-action@v5
        with:
          context: ./eventflow/order-service
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-order-service:latest

      - name: Build and Push inventory-service
        uses: docker/build-push-action@v5
        with:
          context: ./eventflow/inventory-service
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-inventory-service:latest

      - name: Build and Push payment-service
        uses: docker/build-push-action@v5
        with:
          context: ./eventflow/payment-service
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-payment-service:latest

      - name: Build and Push notification-service
        uses: docker/build-push-action@v5
        with:
          context: ./eventflow/notification-service
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-notification-service:latest

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copier le compose de prod sur le serveur
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: eventflow/docker-compose.prod.yml
          target: /home/ubuntu/eventflow
          strip_components: 1

      - name: Déployer sur le serveur
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            cd ~/eventflow
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d

            for i in $(seq 1 24); do
              if curl -fsS http://localhost:8081/actuator/health > /dev/null; then
                echo "Application UP"
                docker image prune -f
                exit 0
              fi

              echo "En attente de l'application ($i/24)..."
              sleep 10
            done

            echo "Échec du health check"
            docker compose -f docker-compose.prod.yml ps
            docker compose -f docker-compose.prod.yml logs --tail=50 order-service
            exit 1

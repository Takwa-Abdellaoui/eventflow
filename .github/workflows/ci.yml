name: EventFlow CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}/eventflow

jobs:

  build:
    name: Maven Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build all services
        run: |
          mvn package -f eventflow/order-service/pom.xml -DskipTests -B
          mvn package -f eventflow/inventory-service/pom.xml -DskipTests -B
          mvn package -f eventflow/payment-service/pom.xml -DskipTests -B
          mvn package -f eventflow/notification-service/pom.xml -DskipTests -B

  docker:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Maven artifacts
        run: |
          mvn package -f eventflow/order-service/pom.xml -DskipTests -B
          mvn package -f eventflow/inventory-service/pom.xml -DskipTests -B
          mvn package -f eventflow/payment-service/pom.xml -DskipTests -B
          mvn package -f eventflow/notification-service/pom.xml -DskipTests -B

      - name: Build and Push order-service
        uses: docker/build-push-action@v5
        with:
          context: ./eventflow/order-service
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-order-service:latest

      - name: Build and Push inventory-service
        uses: docker/build-push-action@v5
        with:
          context: ./eventflow/inventory-service
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-inventory-service:latest

      - name: Build and Push payment-service
        uses: docker/build-push-action@v5
        with:
          context: ./eventflow/payment-service
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-payment-service:latest

      - name: Build and Push notification-service
        uses: docker/build-push-action@v5
        with:
          context: ./eventflow/notification-service
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-notification-service:latest
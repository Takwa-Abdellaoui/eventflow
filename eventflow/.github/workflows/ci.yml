name: EventFlow CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}/eventflow

jobs:

  # ─────────────────────────────────────────
  # JOB 1 : Tests unitaires
  # ─────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests — order-service
        run: mvn test -f order-service/pom.xml -B

      - name: Run tests — inventory-service
        run: mvn test -f inventory-service/pom.xml -B

      - name: Run tests — payment-service
        run: mvn test -f payment-service/pom.xml -B

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            order-service/target/surefire-reports/
            inventory-service/target/surefire-reports/
            payment-service/target/surefire-reports/

  # ─────────────────────────────────────────
  # JOB 2 : Build Maven
  # ─────────────────────────────────────────
  build:
    name: Maven Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build — order-service
        run: mvn package -f order-service/pom.xml -DskipTests -B

      - name: Build — inventory-service
        run: mvn package -f inventory-service/pom.xml -DskipTests -B

      - name: Build — payment-service
        run: mvn package -f payment-service/pom.xml -DskipTests -B

      - name: Build — notification-service
        run: mvn package -f notification-service/pom.xml -DskipTests -B

  # ─────────────────────────────────────────
  # JOB 3 : Docker Build + Push (main only)
  # ─────────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Maven artifacts
        run: |
          mvn package -f order-service/pom.xml -DskipTests -B
          mvn package -f inventory-service/pom.xml -DskipTests -B
          mvn package -f payment-service/pom.xml -DskipTests -B
          mvn package -f notification-service/pom.xml -DskipTests -B

      - name: Build & Push — order-service
        uses: docker/build-push-action@v5
        with:
          context: ./order-service
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-order-service:latest,${{ env.IMAGE_PREFIX }}-order-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push — inventory-service
        uses: docker/build-push-action@v5
        with:
          context: ./inventory-service
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-inventory-service:latest,${{ env.IMAGE_PREFIX }}-inventory-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push — payment-service
        uses: docker/build-push-action@v5
        with:
          context: ./payment-service
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-payment-service:latest,${{ env.IMAGE_PREFIX }}-payment-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push — notification-service
        uses: docker/build-push-action@v5
        with:
          context: ./notification-service
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-notification-service:latest,${{ env.IMAGE_PREFIX }}-notification-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pipeline summary
        run: |
          echo "## ✅ Docker images pushed" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.IMAGE_PREFIX }}-order-service:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.IMAGE_PREFIX }}-inventory-service:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.IMAGE_PREFIX }}-payment-service:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.IMAGE_PREFIX }}-notification-service:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

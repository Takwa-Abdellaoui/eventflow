# docker-compose.prod.yml : EventFlow sur AWS EC2
# Lancement : TAG=<sha-ou-latest> docker compose -f docker-compose.prod.yml up -d
# Le mot de passe des bases vient du fichier .env situé à côté de ce fichier (DB_PASSWORD=...)

x-java-service: &java-service
  restart: unless-stopped
  mem_limit: 512m
  networks:
    - eventflow-network
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-java-env: &java-env
  JAVA_TOOL_OPTIONS: "-Xmx256m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC"
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092

services:

  # ── Kafka en mode KRaft (sans Zookeeper) ──────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: eventflow-kafka
    restart: unless-stopped
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - eventflow-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:29092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Bases de données (aucun port publié) ──────────────────────
  orders-db:
    image: postgres:16-alpine
    container_name: eventflow-orders-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: eventflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env}
    volumes:
      - orders-db-data:/var/lib/postgresql/data
    networks:
      - eventflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventflow -d orders_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  inventory-db:
    image: postgres:16-alpine
    container_name: eventflow-inventory-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: eventflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env}
    volumes:
      - inventory-db-data:/var/lib/postgresql/data
    networks:
      - eventflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventflow -d inventory_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  payments-db:
    image: postgres:16-alpine
    container_name: eventflow-payments-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: payments_db
      POSTGRES_USER: eventflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant dans .env}
    volumes:
      - payments-db-data:/var/lib/postgresql/data
    networks:
      - eventflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventflow -d payments_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Microservices (images DockerHub) ──────────────────────────
  # Seul order-service est exposé publiquement (port 8081).
  order-service:
    <<: *java-service
    image: takwaabdellaoui/eventflow-order-service:${TAG:-latest}
    container_name: eventflow-order-service
    depends_on:
      orders-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      <<: *java-env
      DB_HOST: orders-db
      DB_USER: eventflow
      DB_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  inventory-service:
    <<: *java-service
    image: takwaabdellaoui/eventflow-inventory-service:${TAG:-latest}
    container_name: eventflow-inventory-service
    depends_on:
      inventory-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *java-env
      DB_HOST: inventory-db
      DB_USER: eventflow
      DB_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  payment-service:
    <<: *java-service
    image: takwaabdellaoui/eventflow-payment-service:${TAG:-latest}
    container_name: eventflow-payment-service
    depends_on:
      payments-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *java-env
      DB_HOST: payments-db
      DB_USER: eventflow
      DB_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  notification-service:
    <<: *java-service
    image: takwaabdellaoui/eventflow-notification-service:${TAG:-latest}
    container_name: eventflow-notification-service
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      <<: *java-env

networks:
  eventflow-network:
    driver: bridge

volumes:
  kafka-data:
  orders-db-data:
  inventory-db-data:
  payments-db-data:

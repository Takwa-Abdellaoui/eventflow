server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interne de Docker : permet à Nginx de démarrer même si un service API n'est pas encore prêt
    resolver 127.0.0.11 valid=10s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API commandes -> order-service
    location /api/v1/orders {
        set $order_upstream http://order-service:8081;
        proxy_pass $order_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # API stock -> inventory-service
    location /api/v1/inventory {
        set $inventory_upstream http://inventory-service:8082;
        proxy_pass $inventory_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Application Angular (routes gérées côté navigateur)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
